# Builds the "does a native binary run after a Partner-signed install?" experiment:
# cross-compiles a tiny C program for ARMv7 Linux, packages it as an unsigned .tpk,
# and leaves it on a draft release ready for the usual tizen-homebrew install flow.
#
# This workflow does no signing. tizen-homebrew's installer re-signs on install with
# the user's stored author/distributor certificates, which is where the Partner tier
# comes from — nothing here needs those certificates.
name: native-exec experiment

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/native-exec/**'
      - '.github/workflows/native-exec-experiment.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zig ships every cross-compiler in one binary; `zig cc -target arm-linux-musleabihf`
      # produces a static ARMv7 musl binary with no toolchain setup.
      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Verify Zig
        run: zig version

      - name: Build
        run: |
          mkdir -p experiments/native-exec/build/bin experiments/native-exec/release
          zig cc -target arm-linux-musleabihf -static -Os -s \
            -o experiments/native-exec/build/bin/hello \
            experiments/native-exec/src/hello.c
          cp experiments/native-exec/tizen-manifest.xml experiments/native-exec/build/
          version="$(grep -oE 'version="[^"]+"' experiments/native-exec/tizen-manifest.xml | head -1 | cut -d'"' -f2)"
          pkg="experiments/native-exec/release/org.homebrew.nativeexec-${version}.tpk"
          (cd experiments/native-exec/build && zip -q -X -r "../../../$pkg" tizen-manifest.xml bin/)
          file experiments/native-exec/build/bin/hello
          unzip -l "$pkg"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-exec-tpk
          path: experiments/native-exec/release/*.tpk
          if-no-files-found: error

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-exec-${{ github.run_number }}
          name: native-exec experiment #${{ github.run_number }}
          draft: true
          prerelease: true
          make_latest: 'false'
          files: experiments/native-exec/release/*.tpk
          fail_on_unmatched_files: true
