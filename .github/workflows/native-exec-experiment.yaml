# Builds the "does a native binary run after a Partner-signed install?" experiment:
# cross-compiles a tiny C program for ARMv7 Linux, packages it as an unsigned .tpk,
# and leaves it on a draft release ready for the usual tizen-homebrew install flow.
#
# This workflow does no signing. tizen-homebrew's installer re-signs on install with
# the user's stored author/distributor certificates, which is where the Partner tier
# comes from — nothing here needs those certificates.
name: native-exec experiment

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/native-exec/**'
      - '.github/workflows/native-exec-experiment.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # musl.cc ships a prebuilt ARMv7 musl cross-toolchain. Static linking against
      # musl means we don't depend on the TV's glibc version, and the binary stays
      # small (a few hundred KB) with no runtime loader. Pinned by hash so a drive-by
      # tarball swap can't change what we build.
      - name: Install ARMv7 musl toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/opt" && cd "$HOME/opt"
          curl -fsSL https://musl.cc/arm-linux-musleabihf-cross.tgz -o toolchain.tgz
          tar -xzf toolchain.tgz
          echo "$HOME/opt/arm-linux-musleabihf-cross/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: arm-linux-musleabihf-gcc --version

      - name: Build
        run: experiments/native-exec/build.sh

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-exec-tpk
          path: experiments/native-exec/release/*.tpk
          if-no-files-found: error

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-exec-${{ github.run_number }}
          name: native-exec experiment #${{ github.run_number }}
          draft: true
          prerelease: true
          make_latest: 'false'
          files: experiments/native-exec/release/*.tpk
          fail_on_unmatched_files: true
