# Builds TizenSsh as a framework-dependent netcoreapp3.1 app and ships it as a draft
# release. "Framework-dependent" means we do NOT bundle the .NET runtime — the TV already
# has 3.1.3, and that's the one with cap_setgid/cap_sys_admin we want running this code.
name: tizen-ssh

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/tizen-ssh/**'
      - '.github/workflows/tizen-ssh.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Microsoft's 3.1 SDK was built against the glibc that ships in Ubuntu 20.04
    # ("focal") and SIGABRTs on anything newer. The maintained container image
    # keeps the matching runtime around, which is also what the TV runs. The
    # artifact we produce is portable managed IL — no native deps picked up.
    container: mcr.microsoft.com/dotnet/sdk:3.1-focal
    steps:
      - uses: actions/checkout@v4

      - name: Dotnet info
        run: dotnet --info

      - name: Restore and publish
        working-directory: experiments/tizen-ssh/TizenSsh
        run: |
          set +e
          dotnet restore 2>&1 | tee /tmp/restore.log
          restore_code=${PIPESTATUS[0]}
          if [ $restore_code -eq 0 ]; then
            dotnet publish -c Release --no-self-contained -o publish 2>&1 | tee /tmp/publish.log
            publish_code=${PIPESTATUS[0]}
          else
            publish_code=skipped
          fi

          # Writes the step summary that the GH Checks API returns via a public
          # endpoint, so the whole dotnet transcript is reachable even when the
          # raw log zip and the artifact store are proxy-gated.
          {
            echo '## tizen-ssh build'
            echo
            echo "- restore exit: \`$restore_code\`"
            echo "- publish exit: \`$publish_code\`"
            echo
            echo '### Restore log (tail)'
            echo '```'
            tail -c 8000 /tmp/restore.log || true
            echo '```'
            echo
            echo '### Publish log (tail)'
            echo '```'
            [ -f /tmp/publish.log ] && tail -c 8000 /tmp/publish.log || echo '(not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$restore_code" -ne 0 ]; then exit $restore_code; fi
          if [ "$publish_code" != 0 ]; then exit 1; fi

          echo "=== publish output ==="
          ls -la publish/

      - name: Stage deployment layout
        working-directory: experiments/tizen-ssh
        run: |
          mkdir -p stage
          cp TizenSsh/publish/TizenSsh.dll stage/
          cp TizenSsh/publish/TizenSsh.deps.json stage/
          cp TizenSsh/publish/TizenSsh.runtimeconfig.json stage/
          cp TizenSsh/publish/FxSsh.dll stage/ || true
          # Sample authorized_keys the user replaces.
          cat > stage/authorized_keys <<'EOF'
          # One SSH public key per line, OpenSSH format:
          # ssh-rsa AAAA... alice@laptop
          EOF
          # Launcher that sets things up and runs the server. The dotnet entrypoint takes
          # the dll as its arg; by convention we put it next to the dll.
          cat > stage/tizen-ssh.sh <<'EOF'
          #!/bin/sh
          # Launches tizen-ssh under the TV's bundled dotnet. Run from this directory.
          cd "$(dirname "$0")"
          exec /usr/bin/dotnet ./TizenSsh.dll
          EOF
          chmod +x stage/tizen-ssh.sh
          ls -la stage/

      - name: Zip
        working-directory: experiments/tizen-ssh
        run: cd stage && zip -q -X -r ../tizen-ssh.zip .

      - name: Upload artifact (zipped by GH)
        uses: actions/upload-artifact@v4
        with:
          name: tizen-ssh
          path: experiments/tizen-ssh/tizen-ssh.zip
          if-no-files-found: error

      # Draft release carries the zip byte-for-byte, so there's a plain .zip link
      # on the release page you can download without unwrapping twice.
      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tizen-ssh-${{ github.run_number }}
          name: tizen-ssh #${{ github.run_number }}
          draft: true
          prerelease: true
          make_latest: 'false'
          files: experiments/tizen-ssh/tizen-ssh.zip
          fail_on_unmatched_files: true
