# Builds TizenSsh as a framework-dependent netcoreapp3.1 app and ships it as a draft
# release. "Framework-dependent" means we do NOT bundle the .NET runtime — the TV already
# has 3.1.3, and that's the one with cap_setgid/cap_sys_admin we want running this code.
name: tizen-ssh

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/tizen-ssh/**'
      - '.github/workflows/tizen-ssh.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Microsoft's 3.1 SDK was built against the glibc that ships in Ubuntu 20.04
    # ("focal") and SIGABRTs on anything newer. The maintained container image
    # keeps the matching runtime around, which is also what the TV runs. The
    # artifact we produce is portable managed IL — no native deps picked up.
    container: mcr.microsoft.com/dotnet/sdk:3.1-focal
    env:
      # Skip the first-run welcome and telemetry prompts; otherwise they prefix
      # every dotnet invocation and crowd out the real output in truncated logs.
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Dotnet info
        run: dotnet --info

      - name: Restore and publish
        working-directory: experiments/tizen-ssh/TizenSsh
        shell: bash
        run: |
          set +e +o pipefail
          echo "::notice::tizen-ssh build step reached"

          dotnet restore > /tmp/restore.log 2>&1
          restore_code=$?

          publish_code=skipped
          if [ "$restore_code" -eq 0 ]; then
            dotnet publish -c Release --no-self-contained -o publish > /tmp/publish.log 2>&1
            publish_code=$?
          fi

          # Emit the FIRST error line and the LAST error line from dotnet as GitHub
          # annotations — the only workflow output the Checks API reliably returns
          # through our proxy. One line per annotation; GH strips embedded newlines
          # so we pre-flatten with "::line::" separators.
          emit() {
            local label="$1" file="$2"
            [ -f "$file" ] || return 0
            # The last ~60 non-empty lines (MSBuild error at the end usually).
            grep -v '^$' "$file" | tail -60 | nl -ba | while IFS= read -r line; do
              echo "::error title=$label::${line}"
            done
            # The very first MSBuild "error" line, if any.
            grep -m1 -E ' error [A-Z0-9]+:|: error:' "$file" | while IFS= read -r line; do
              echo "::error title=$label-first::${line}"
            done
          }

          echo "restore_code=$restore_code"
          echo "publish_code=$publish_code"
          if [ "$restore_code" -ne 0 ]; then
            emit "restore" /tmp/restore.log
            echo "::error::dotnet restore failed with exit $restore_code"
            exit "$restore_code"
          fi
          if [ "$publish_code" != 0 ]; then
            emit "publish" /tmp/publish.log
            echo "::error::dotnet publish failed with exit $publish_code"
            exit 1
          fi
          ls -la publish/

      - name: Stage deployment layout
        working-directory: experiments/tizen-ssh
        run: |
          mkdir -p stage
          cp TizenSsh/publish/TizenSsh.dll stage/
          cp TizenSsh/publish/TizenSsh.deps.json stage/
          cp TizenSsh/publish/TizenSsh.runtimeconfig.json stage/
          cp TizenSsh/publish/FxSsh.dll stage/ || true
          # Sample authorized_keys the user replaces.
          cat > stage/authorized_keys <<'EOF'
          # One SSH public key per line, OpenSSH format:
          # ssh-rsa AAAA... alice@laptop
          EOF
          # Launcher that sets things up and runs the server. The dotnet entrypoint takes
          # the dll as its arg; by convention we put it next to the dll.
          cat > stage/tizen-ssh.sh <<'EOF'
          #!/bin/sh
          # Launches tizen-ssh under the TV's bundled dotnet. Run from this directory.
          cd "$(dirname "$0")"
          exec /usr/bin/dotnet ./TizenSsh.dll
          EOF
          chmod +x stage/tizen-ssh.sh
          ls -la stage/

      # The dotnet:3.1-focal image is minimal and ships no `zip`; apt-get install
      # keeps the diff small (one package).
      - name: Install zip
        run: apt-get update && apt-get install -y --no-install-recommends zip

      - name: Zip
        working-directory: experiments/tizen-ssh
        run: cd stage && zip -q -X -r ../tizen-ssh.zip .

      - name: Upload artifact (zipped by GH)
        uses: actions/upload-artifact@v4
        with:
          name: tizen-ssh
          path: experiments/tizen-ssh/tizen-ssh.zip
          if-no-files-found: error

      # Draft release carries the zip byte-for-byte, so there's a plain .zip link
      # on the release page you can download without unwrapping twice.
      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tizen-ssh-${{ github.run_number }}
          name: tizen-ssh #${{ github.run_number }}
          draft: true
          prerelease: true
          make_latest: 'false'
          files: experiments/tizen-ssh/tizen-ssh.zip
          fail_on_unmatched_files: true
